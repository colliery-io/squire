[package]
name = "store"
version = "0.1.0"
edition = "2021"
description = "Squire — Diesel-backed persistence (Repository + Clock) for the domain core, per task SQUIRE-T-0008"

[dependencies]
domain-core = { path = "../domain-core" }
diesel = { version = "2.2", default-features = false, features = ["sqlite", "64-column-tables"] }
diesel_migrations = "2.2"
# Bundled SQLite so no system sqlite is needed for the default build.
libsqlite3-sys = { version = "0.30", features = ["bundled"] }
# Backend-portable serialized dump (per-tenant export/import — SQUIRE-T-0012).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Household-config (ADR SQUIRE-A-0011): timezone-aware local-midnight clock. `jiff` provides the
# IANA tz database + DST-correct civil-date conversion. `arc-swap` backs the hot, lock-free config
# cell (`Arc<ArcSwap<ConfigView>>`).
jiff = "0.2"
arc-swap = "1"

[features]
default = []
# Postgres is OPT-IN: enabling it pulls diesel's postgres backend, which requires
# a system libpq at build/link time. Not exercised in the default build/tests.
postgres = ["diesel/postgres"]

[dev-dependencies]
tempfile = "3"
proptest = "1.11.0"
