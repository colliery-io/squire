[package]
name = "api"
version = "0.1.0"
edition = "2021"
description = "Squire — LAN HTTP server (axum): the only network seam / trust boundary, per task SQUIRE-T-0014"

[dependencies]
domain-core = { path = "../domain-core", features = ["serde"] }
store = { path = "../store" }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# `ServiceExt::oneshot` drives the Router without binding a socket.
tower = { version = "0.5", features = ["util"] }
# Collect response bodies in tests.
http-body-util = "0.1"
# Isolated temp-dir SQLite tenant per test.
tempfile = "3"
