[package]
name = "api"
version = "0.1.0"
edition = "2021"
description = "Squire — LAN HTTP server (axum): the only network seam / trust boundary, per task SQUIRE-T-0014"

[dependencies]
domain-core = { path = "../domain-core", features = ["serde", "openapi"] }
store = { path = "../store" }
identity = { path = "../identity" }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Content-hash for OTA update detection (SQUIRE-T-0085): SHA-256 of the published APK, injected into
# the /app/manifest response so a same-version rebuild still propagates.
sha2 = "0.10"
# OpenAPI 3 contract emission from the Rust types (SQUIRE-T-0031 / ADR SQUIRE-A-0009).
utoipa = { version = "5", features = ["axum_extras"] }
# Structured logging (SQUIRE-T-0127): the per-request access log (`axum::middleware::from_fn`)
# and handler-level rejection events emit via the `tracing` facade. The subscriber that renders
# these is installed by the binary crate (squire-home), not here.
tracing = "0.1"

[features]
default = []
# Opt-in: compile the Postgres-backed identity/provisioning path (links system libpq via
# `store`/`identity`). Used by the dual-backend prod-integration tests run against the
# docker-compose Postgres service.
postgres = ["store/postgres", "identity/postgres"]

[dev-dependencies]
# `ServiceExt::oneshot` drives the Router without binding a socket.
tower = { version = "0.5", features = ["util"] }
# Collect response bodies in tests.
http-body-util = "0.1"
# Isolated temp-dir SQLite tenant per test.
tempfile = "3"
# Gherkin/Cucumber acceptance suite (SQUIRE-I-0004 / SQUIRE-T-0110): true `.feature` files driven
# against the axum Router over the oneshot fixture. The shared scenario vocabulary the client suites reuse.
cucumber = "0.21"
futures = "0.3"

# The Cucumber harness runs as its own binary (no libtest), so it needs `harness = false`.
[[test]]
name = "cucumber"
harness = false
