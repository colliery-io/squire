[package]
name = "squire-home"
# Tracks the release tag so the self-updater (SQUIRE-T-0089) compares correctly against the dist
# repo's latest GitHub Release. Set to the UPCOMING release so a build is only ever "older" than a
# release published after it (no update loop).
version = "0.7.21"
edition = "2021"
description = "Squire home server — runs the Keep (loopback admin) AND the LAN api over ONE shared store, so the parent's Keep and the child's phone share a household. Demo/dev entrypoint."

[dependencies]
domain-core = { path = "../domain-core", features = ["serde"] }
store = { path = "../store" }
identity = { path = "../identity" }
# Depends on BOTH surfaces (keep ↔ api stay independent of each other; this is the one place
# that composes them). No cycle: api/keep do not depend on this crate.
api = { path = "../api" }
keep = { path = "../keep" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time"] }
# Server-side APK pull from the public dist repo (SQUIRE-T-0087 / ADR SQUIRE-A-0012): fetch the
# latest release asset over HTTPS. rustls to avoid a system OpenSSL/libssl dependency.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1"
# Server self-update from the public dist repo's GitHub Releases (SQUIRE-T-0089 / ADR SQUIRE-A-0012):
# pull a newer squire-serve binary for this platform, replace the running exe, then re-exec. rustls
# (no system OpenSSL); tar.gz on unix, zip on Windows.
self_update = { version = "0.42", default-features = false, features = ["rustls", "archive-tar", "archive-zip", "compression-flate2"] }
# Best-effort mDNS/DNS-SD advertisement of `_squire._tcp` so phones discover the api without a
# typed IP (ADR SQUIRE-A-0010 / NFR-6, SQUIRE-T-0047). Opt-out via SQUIRE_MDNS=off.
libmdns = "0.9"
# Persistent server (squire-serve, SQUIRE-T-0048): OS data dir + a generated, persisted signing key.
dirs = "5"
getrandom = "0.2"
# Onboarding (ADR SQUIRE-A-0011, SQUIRE-T-0067): detect the home computer's IANA timezone to seed
# the household config on first run (validated via `store::valid_timezone`).
iana-time-zone = "0.1"
# Structured logging (SQUIRE-T-0127): this crate owns the process entrypoints, so it installs the
# global subscriber (`init_tracing`). `fmt` renders to stderr; `env-filter` honours `RUST_LOG`
# (default `info`). The library crates (api/keep) emit via the `tracing` facade against it.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
