[package]
name = "squire-desktop"
version = "0.7.3"
edition = "2021"
description = "Squire — native desktop app (SQUIRE-T-0092): a Tauri window hosting the Keep, with the home server embedded."

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["rt-multi-thread"] }
squire-home = { path = "../squire-home" }
