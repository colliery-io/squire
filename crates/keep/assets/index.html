<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Squire — the Keep</title>
  <link rel="stylesheet" href="/static/keep.css" />
</head>
<body>
  <header>
    <h1>⚔️ The Keep</h1>
    <p class="sub">Squire household admin · local only</p>
  </header>

  <main>
    <!-- Operator login. The Keep is operated by a Knight; the acting Knight is stamped as the
         author/actor of every committed change (audit). This is a same-machine admin surface. -->
    <section id="login">
      <h2>Sign in</h2>
      <form id="login-form" method="post" action="/login">
        <label>Knight id <input name="user" inputmode="numeric" required /></label>
        <label>Secret <input name="secret" type="password" required /></label>
        <button type="submit">Sign in</button>
      </form>
      <p id="login-error" class="error" hidden></p>
    </section>

    <!-- Authenticated shell. Later Keep tasks (T-0026..T-0030) mount authoring, the review queue,
         member admin, and the log inspector here. -->
    <section id="shell" hidden>
      <p>Signed in as <strong id="who"></strong>.</p>
      <nav>
        <a href="#quests">Quests</a> ·
        <a href="#review">Review</a> ·
        <a href="#items">Items</a> ·
        <a href="#members">Members</a> ·
        <a href="#log">Log</a>
      </nav>
    </section>

    <!-- Quest authoring (SQUIRE-T-0026). A minimal create form (daily / all squires / each
         assignee); the JSON API behind it supports the full cadence/assignment/completion shape. -->
    <section id="quests-panel" hidden>
      <h2 id="quests">Quests</h2>
      <form id="quest-form">
        <label>Title <input name="title" required /></label>
        <label>Reward (points) <input name="reward" type="number" min="0" value="5" required /></label>
        <label><input name="auto_approve" type="checkbox" /> Auto-approve (skip review)</label>
        <button type="submit">Add quest</button>
      </form>
      <p id="quest-error" class="error" hidden></p>
      <ul id="quest-list"></ul>
    </section>

    <!-- Item authoring (SQUIRE-T-0027). Availability is Once or Repeatable only (A-0006). -->
    <section id="items-panel" hidden>
      <h2 id="items">Rewards</h2>
      <form id="item-form">
        <label>Name <input name="name" required /></label>
        <label>Cost (points) <input name="cost" type="number" min="0" value="3" required /></label>
        <label>Availability
          <select name="availability">
            <option value="Repeatable">Repeatable</option>
            <option value="Once">Once (out of stock after redemption)</option>
          </select>
        </label>
        <button type="submit">Add reward</button>
      </form>
      <p id="item-error" class="error" hidden></p>
      <ul id="item-list"></ul>
    </section>

    <!-- Achievement authoring (SQUIRE-T-0027). Minimal: a points-earned criterion. -->
    <section id="achievements-panel" hidden>
      <h2 id="achievements">Achievements</h2>
      <form id="achievement-form">
        <label>Name <input name="name" required /></label>
        <label>Points to earn <input name="total" type="number" min="1" value="100" required /></label>
        <label>Bonus points <input name="bonus" type="number" min="0" value="10" required /></label>
        <button type="submit">Add achievement</button>
      </form>
      <p id="achievement-error" class="error" hidden></p>
      <ul id="achievement-list"></ul>
    </section>
  </main>

  <script src="/static/keep.js"></script>
</body>
</html>
