name: Publish docs

# Build the mdBook doc site (docs/) and publish it to this repo's GitHub Pages (gh-pages branch),
# per ADR SQUIRE-A-0018. Runs on docs changes only, decoupled from release tags so docs ship
# independently of APKs/server binaries. See .github/RELEASING.md and SQUIRE-T-0119.
#
# One-time on this repo: enable Pages with source = gh-pages branch (root).

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: write # push the gh-pages branch

concurrency:
  group: docs-publish
  cancel-in-progress: true

env:
  MDBOOK_VERSION: "0.5.2"

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mdBook
        run: |
          mkdir -p "$HOME/.local/bin"
          url="https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL "$url" | tar -xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build the book
        run: |
          mdbook build docs
          test -f docs/book/index.html || { echo "::error::mdbook produced no index.html"; exit 1; }

      - name: Publish to gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          cd docs/book
          touch .nojekyll                       # serve files verbatim; don't run Jekyll
          git init -q
          git config user.name  "squire-docs-bot"
          git config user.email "docs@colliery.io"
          git checkout -q -b gh-pages
          git add -A
          git commit -q -m "docs: deploy from squire@${SHA}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
