name: Publish docs

# Build the Starlight doc site (docs/, starlight-aurora) and publish it to this repo's GitHub Pages
# (gh-pages branch), per ADR SQUIRE-A-0018. A pull request that changes docs/ builds the site only;
# a push to main builds and publishes it. Runs on docs changes only, decoupled from release tags so
# docs ship independently of APKs/server binaries. See .github/RELEASING.md and SQUIRE-T-0148.
#
# One-time on this repo: enable Pages with source = gh-pages branch (root).

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: write # push the gh-pages branch

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: npm ci --no-audit --no-fund

      # The site is served at https://colliery-io.github.io/squire/. On a pull request DOCS_SITE and
      # DOCS_BASE are empty and the site builds at /.
      - name: Build the site
        env:
          DOCS_SITE: ${{ github.event_name != 'pull_request' && 'https://colliery-io.github.io' || '' }}
          DOCS_BASE: ${{ github.event_name != 'pull_request' && '/squire' || '' }}
        run: |
          npm run build
          test -f dist/index.html || { echo "::error::the build produced no index.html"; exit 1; }

      - name: Publish to gh-pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          cd dist
          touch .nojekyll                       # serve files verbatim; don't run Jekyll (_astro/)
          git init -q
          git config user.name  "squire-docs-bot"
          git config user.email "docs@colliery.io"
          git checkout -q -b gh-pages
          git add -A
          git commit -q -m "docs: deploy from squire@${SHA}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
