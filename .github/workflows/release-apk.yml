name: Release phone APK

# Build + sign the Squire phone APK on a version tag and publish it to the PUBLIC distribution
# repo (colliery-io/squire), per ADR SQUIRE-A-0012. Home servers + the install QR pull the
# artifact from there unauthenticated; the source repo stays private.
#
# Required repository secrets (set with `gh secret set` — see .github/RELEASING.md):
#   SIGNING_KEYSTORE_B64    base64 of clients/squire-android/keystore/squire-release.jks
#   SIGNING_STORE_PASSWORD  keystore store password
#   SIGNING_KEY_PASSWORD    signing key password
#   SIGNING_KEY_ALIAS       signing key alias (e.g. "squire")
#   DIST_REPO_TOKEN         PAT with contents:write on colliery-io/squire

on:
  push:
    tags:
      - "v*"
  # Re-run the APK build for an existing tag (e.g. after a CI-only fix) without cutting a new
  # release. Mirrors release-server.yml. The workflow file comes from the default branch; the
  # app code is checked out at the tag.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build + attach the APK to (e.g. v0.7.17)"
        required: true

permissions:
  contents: read

env:
  DIST_REPO: colliery-io/squire

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: tag
        shell: bash
        run: echo "tag=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Explicit package list: the action's default includes the long-retired `tools` package,
      # and on current runner images sdkmanager now fails on it ("Failed to find package 'tools'"),
      # which broke the v0.7.17 build before a single line of app code ran.
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - name: Materialize signing config from secrets
        working-directory: clients/squire-android
        env:
          KS_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
          STORE_PW: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_PW: ${{ secrets.SIGNING_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "::error::SIGNING_KEYSTORE_B64 is empty — set the signing secrets (see .github/RELEASING.md)"
            exit 1
          fi
          mkdir -p keystore
          printf '%s' "$KS_B64" | base64 -d > keystore/squire-release.jks
          {
            echo "storeFile=keystore/squire-release.jks"
            echo "storePassword=$STORE_PW"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PW"
          } > keystore.properties

      - name: Build signed release APK
        working-directory: clients/squire-android
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Stage artifact (squire-<versionCode>.apk)
        id: stage
        working-directory: clients/squire-android
        run: |
          VC=$(grep -oE 'versionCode = [0-9]+' app/build.gradle.kts | grep -oE '[0-9]+')
          VN=$(grep -oE 'versionName = "[^"]+"' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          test -n "$VC" && test -n "$VN" || { echo "::error::could not read versionCode/Name"; exit 1; }
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/squire-$VC.apk"
          echo "vc=$VC" >> "$GITHUB_OUTPUT"
          echo "vn=$VN" >> "$GITHUB_OUTPUT"
          echo "Built squire-$VC.apk (v$VN)"

      - name: Verify signer (fail fast if the release cert is wrong)
        working-directory: clients/squire-android
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "$RUNNER_TEMP/squire-${{ steps.stage.outputs.vc }}.apk" \
            | grep -i "SHA-256 digest"

      - name: Publish to the public dist repo
        env:
          GH_TOKEN: ${{ secrets.DIST_REPO_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
          VC: ${{ steps.stage.outputs.vc }}
          VN: ${{ steps.stage.outputs.vn }}
        run: |
          APK="$RUNNER_TEMP/squire-$VC.apk"
          # Create the release if it doesn't exist yet; otherwise just add/replace the asset.
          if gh release view "$TAG" --repo "$DIST_REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --repo "$DIST_REPO" --clobber
          else
            gh release create "$TAG" "$APK" \
              --repo "$DIST_REPO" \
              --title "Squire $VN" \
              --notes "Automated release — Squire $VN (versionCode $VC)."
          fi
